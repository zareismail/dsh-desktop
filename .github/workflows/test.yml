name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n bin/dsh-desktop install.sh uninstall.sh tests/smoke.sh
      - name: Smoke test (throwaway HOME)
        run: bash tests/smoke.sh
